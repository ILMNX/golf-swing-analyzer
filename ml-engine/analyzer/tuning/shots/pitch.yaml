# Pitch — pukulan menengah dengan trajektori tinggi
validation:
  min_visible_keypoint_ratio: 0.52
  min_person_height_ratio: 0.23
  min_side_view_score: 0.38

scoring_weights:
  tempo: 0.18
  posture: 0.22
  rotation: 0.18
  balance: 0.25
  head_stability: 0.17

metrics_focus:
  - tempo
  - balance
  - rotation

expected_ranges:
  x_factor_deg:
    min: 10
    ideal: 22
    max: 35
  tempo_ratio:
    min: 2.2
    ideal: 2.8
    max: 3.4
  hip_sway_normalized:
    max: 0.32

recommendation_rules:
  - metric: tempo
    below: 70
    message: "Tempo pitch harus terkontrol — hindari deceleration mendadak."
  - metric: balance
    below: 72
    message: "Sway berlebihan pada pitch — tahan finish hingga bola mendarat."
