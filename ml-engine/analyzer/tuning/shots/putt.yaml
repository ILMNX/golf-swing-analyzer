# Putt — minimal rotasi, fokus stabilitas
validation:
  min_visible_keypoint_ratio: 0.45
  min_person_height_ratio: 0.18
  min_side_view_score: 0.25

scoring_weights:
  tempo: 0.10
  posture: 0.20
  rotation: 0.05
  balance: 0.35
  head_stability: 0.30

metrics_focus:
  - head_stability
  - balance
  - posture

expected_ranges:
  x_factor_deg:
    max: 10
  head_movement_normalized:
    max: 0.12
  hip_sway_normalized:
    max: 0.15
  spine_angle_retention_deg:
    max: 5
  tempo_ratio:
    min: 1.5
    ideal: 2.0
    max: 2.8

recommendation_rules:
  - metric: head_stability
    below: 78
    message: "Kepala bergerak saat putt — pertahankan mata di atas bola hingga impact."
  - metric: balance
    below: 75
    message: "Sway berlebihan saat putt — kaki selebar bahu, berat merata."
  - metric: tempo
    below: 65
    message: "Tempo putt tidak konsisten — latih pendulum motion dengan ritme sama."
