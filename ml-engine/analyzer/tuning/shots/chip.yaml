# Chip — short game dekat green
validation:
  min_visible_keypoint_ratio: 0.50
  min_person_height_ratio: 0.22
  min_side_view_score: 0.35

scoring_weights:
  tempo: 0.15
  posture: 0.25
  rotation: 0.10
  balance: 0.30
  head_stability: 0.20

metrics_focus:
  - balance
  - head_stability
  - posture

expected_ranges:
  x_factor_deg:
    max: 20
  head_movement_normalized:
    max: 0.20
  hip_sway_normalized:
    max: 0.25
  tempo_ratio:
    min: 2.0
    ideal: 2.8
    max: 3.5

recommendation_rules:
  - metric: balance
    below: 75
    message: "Sway berlebihan pada chip — distribusikan berat ke kaki depan."
  - metric: head_stability
    below: 72
    message: "Kepala bergerak saat chip — pertahankan posisi relatif terhadap bola."
