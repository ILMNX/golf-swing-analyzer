# Full swing — baseline untuk drive, iron, wood
validation:
  min_visible_keypoint_ratio: 0.55
  min_person_height_ratio: 0.25
  min_side_view_score: 0.40

scoring_weights:
  tempo: 0.20
  posture: 0.20
  rotation: 0.30
  balance: 0.15
  head_stability: 0.15

metrics_focus:
  - rotation
  - tempo
  - posture
  - balance

expected_ranges:
  x_factor_deg:
    min: 8
    ideal: 25
    max: 50
  tempo_ratio:
    min: 2.6
    ideal: 3.0
    max: 3.6
  spine_angle_retention_deg:
    max: 15
  lead_arm_straightness_impact_deg:
    min: 155
    ideal: 175

recommendation_rules:
  - metric: rotation
    below: 72
    message: "X-factor kurang untuk full swing — fokus pada coil bahu lebih dari pinggul."
  - metric: tempo
    below: 68
    message: "Tempo full swing tidak smooth — hindari terburu-buru di transisi."
