version: "1.0"

validation:
  min_sharpness: 50.0
  min_pose_confidence: 0.35
  min_visible_keypoint_ratio: 0.55
  min_person_height_ratio: 0.25
  min_side_view_score: 0.40
  validation_sample_frames: 12

scoring_weights:
  tempo: 0.20
  posture: 0.25
  rotation: 0.25
  balance: 0.20
  head_stability: 0.10

metrics_focus:
  - tempo
  - posture
  - rotation
  - balance
  - head_stability

expected_ranges:
  x_factor_deg:
    min: 15
    ideal: 30
    max: 50
  tempo_ratio:
    min: 2.5
    ideal: 3.0
    max: 3.8
  spine_angle_retention_deg:
    max: 12
  head_movement_normalized:
    max: 0.35
  hip_sway_normalized:
    max: 0.40

recommendation_rules:
  - metric: head_stability
    below: 70
    message: "Kepala terlalu bergerak — fokus menjaga head steady di atas bola."
  - metric: posture
    below: 70
    message: "Postur spine angle berubah terlalu banyak dari address ke impact."
  - metric: rotation
    below: 70
    message: "X-factor bahu/hip terbatas — tingkatkan coil di backswing."
  - metric: balance
    below: 70
    message: "Sway lateral berlebihan — stabilkan pinggul selama backswing."
  - metric: tempo
    below: 70
    message: "Rasio tempo tidak ideal — latih ritme 3:1 backswing ke downswing."
