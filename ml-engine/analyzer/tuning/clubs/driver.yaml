# Driver — maksimum rotasi & wrist travel
defaults:
  scoring_weights_delta:
    rotation: 0.05
    tempo: 0.03

expected_ranges:
  shoulder_rotation_px:
    min: 25
    ideal: 40
    max: 60
  hip_rotation_px:
    min: 18
    ideal: 35
    max: 50
  right_wrist_travel_px:
    min: 120
    ideal: 200
    max: 320
  stance_width_px:
    ideal: 1.20

recommendation_rules:
  - metric: rotation
    below: 75
    message: "Rotasi kurang untuk driver — tingkatkan shoulder turn tanpa sway lateral."
  - metric: tempo
    below: 70
    message: "Tempo driver terlalu cepat — smooth acceleration, bukan rush."
