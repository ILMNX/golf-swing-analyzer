# Driver — maksimum rotasi
defaults:
  scoring_weights_delta:
    rotation: 0.05
    tempo: 0.03

expected_ranges:
  x_factor_deg:
    min: 12
    ideal: 28
    max: 45
  tempo_ratio:
    min: 2.0
    ideal: 3.0
  hip_sway_normalized:
    max: 0.65

recommendation_rules:
  - metric: rotation
    below: 75
    message: "X-factor kurang untuk driver — tingkatkan shoulder turn tanpa sway lateral."
  - metric: tempo
    below: 70
    message: "Tempo driver terlalu cepat — smooth acceleration, bukan rush."
