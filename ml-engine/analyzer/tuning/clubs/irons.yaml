# Irons — presisi dan compress
defaults:
  scoring_weights_delta:
    posture: 0.03
    tempo: 0.02

iron_7:
  expected_ranges:
    x_factor_deg:
      min: 15
      ideal: 28
    spine_angle_retention_deg:
      max: 12

recommendation_rules:
  - metric: posture
    below: 72
    message: "Spine angle berubah terlalu banyak — pertahankan sudut tubuh konsisten hingga impact."
  - metric: tempo
    below: 70
    message: "Tempo iron terlalu cepat — fokus pada descending blow yang terkontrol."
