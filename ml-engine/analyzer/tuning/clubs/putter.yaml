# Putter
defaults:
  scoring_weights_delta:
    rotation: -0.10
    head_stability: 0.10
    balance: 0.05

expected_ranges:
  x_factor_deg:
    max: 8
  head_movement_normalized:
    max: 0.10

recommendation_rules:
  - metric: head_stability
    below: 80
    message: "Putter: jaga kepala benar-benar diam selama stroke."
