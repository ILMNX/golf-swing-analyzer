# Wedges — short game precision
defaults:
  scoring_weights_delta:
    balance: 0.05
    head_stability: 0.03
    rotation: -0.05

expected_ranges:
  x_factor_deg:
    max: 22
  head_movement_normalized:
    max: 0.22
  hip_sway_normalized:
    max: 0.28

recommendation_rules:
  - metric: head_stability
    below: 74
    message: "Wedge shot membutuhkan kepala stabil — minimalkan gerakan lateral."
  - metric: balance
    below: 73
    message: "Sway wedge berlebihan — kontrol transfer berat ke kaki depan."
