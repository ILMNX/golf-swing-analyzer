# Woods (3W, 5W)
defaults:
  scoring_weights_delta:
    rotation: 0.03
    balance: 0.02

expected_ranges:
  x_factor_deg:
    min: 8
    ideal: 22
  shoulder_rotation_max_deg:
    min: 10
    ideal: 30

recommendation_rules:
  - metric: balance
    below: 72
    message: "Wood membutuhkan balance solid — hindari sway lateral berlebihan saat swing."
